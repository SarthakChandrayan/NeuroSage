<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
    <!-- White background -->
    <rect width="800" height="1000" fill="white"/>
    
    <!-- Header area -->
    <rect x="40" y="40" width="720" height="80" fill="#f5f5f5"/>
    <text x="60" y="85" font-family="Arial" font-size="24" fill="#333333">Sample Document</text>
    
    <!-- Text lines -->
    <g fill="#666666">
        <!-- First paragraph -->
        <rect x="60" y="160" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="180" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="200" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="220" width="480" height="2" fill="#e0e0e0"/>
        
        <!-- Second paragraph -->
        <rect x="60" y="280" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="300" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="320" width="580" height="2" fill="#e0e0e0"/>
        
        <!-- Third paragraph -->
        <rect x="60" y="380" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="400" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="420" width="680" height="2" fill="#e0e0e0"/>
        <rect x="60" y="440" width="400" height="2" fill="#e0e0e0"/>
    </g>
    
    <!-- Page number -->
    <text x="400" y="960" font-family="Arial" font-size="12" fill="#999999" text-anchor="middle">1</text>
</svg> 